name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/superpowers/**"
      - "*.md"
      - "LICENSE"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "PRODUCTION.md"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force a patch version bump and full desktop release"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      old_version: ${{ steps.version.outputs.old_version }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Determine version bump
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
        run: node scripts/determine-version.js

      - name: Update version, README and CHANGELOG
        if: steps.version.outputs.should_release == 'true'
        run: node scripts/update-version.js ${{ steps.version.outputs.new_version }} ${{ steps.version.outputs.old_version }}

      - name: Commit, tag and push
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version file changes to commit"
          else
            git commit -m "chore(release): v${{ steps.version.outputs.new_version }} [skip ci]"
          fi
          git tag "v${{ steps.version.outputs.new_version }}" || true
          git push origin master
          git push origin "v${{ steps.version.outputs.new_version }}" || true

  build-tauri:
    name: Build ${{ matrix.label }}
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @npmax/types --filter @npmax/core --filter @npmax/api-client --filter @npmax/ui --filter @npmax/app-shell build

      - name: Build Tauri bundle
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        # Pass --target to the Tauri CLI (not after `--`, which would only go to cargo).
        # Otherwise the binary lands in target/<triple>/release/ while the bundler
        # looks in target/release/ and fails with ENOENT.
        #
        # macOS: APPLE_CERTIFICATE (+ password) are required for codesign.
        # APPLE_SIGNING_IDENTITY is optional — if missing/wrong we detect it from the .p12
        # (avoids "failed to resolve signing identity" from typos/quotes in the secret).
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            if [ -z "${APPLE_CERTIFICATE:-}" ]; then
              echo "APPLE_CERTIFICATE missing; building without codesigning (macOS)."
              unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            else
              # Strip accidental quotes/whitespace from identity secret
              if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
                APPLE_SIGNING_IDENTITY="$(printf '%s' "$APPLE_SIGNING_IDENTITY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
                export APPLE_SIGNING_IDENTITY
              fi

              CERT_FILE="$(mktemp /tmp/npmax-cert.XXXXXX.p12)"
              KEYCHAIN_PATH="$(mktemp /tmp/npmax-kc.XXXXXX.keychain-db)"
              rm -f "$KEYCHAIN_PATH"
              KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
              echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_FILE"
              security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
              security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
              security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
              # Password may be empty for some exports
              security import "$CERT_FILE" -k "$KEYCHAIN_PATH" -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/security || true
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true

              echo "=== Codesigning identities in certificate ==="
              security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

              DETECTED="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | grep -F 'Developer ID Application:' | head -1 | sed -n 's/.*"\(.*\)"/\1/p' || true)"
              if [ -z "$DETECTED" ]; then
                DETECTED="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | sed -n 's/.*"\(.*\)".*/\1/p' | head -1 || true)"
              fi

              if [ -n "$DETECTED" ]; then
                if [ -z "${APPLE_SIGNING_IDENTITY:-}" ] || [ "$APPLE_SIGNING_IDENTITY" != "$DETECTED" ]; then
                  echo "Using signing identity from .p12: $DETECTED"
                  if [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && [ "$APPLE_SIGNING_IDENTITY" != "$DETECTED" ]; then
                    echo "Note: APPLE_SIGNING_IDENTITY secret did not match .p12 (was: $APPLE_SIGNING_IDENTITY); overriding."
                  fi
                  export APPLE_SIGNING_IDENTITY="$DETECTED"
                else
                  echo "APPLE_SIGNING_IDENTITY matches .p12: $APPLE_SIGNING_IDENTITY"
                fi
              else
                echo "WARNING: No codesigning identity found in APPLE_CERTIFICATE."
                echo "Export a Developer ID Application .p12 (with private key) from Keychain Access."
                if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
                  echo "APPLE_SIGNING_IDENTITY also empty; building without codesigning."
                  unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
                fi
              fi

              rm -f "$CERT_FILE"
              security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            fi
          fi

          pnpm --filter @npmax/desktop exec tauri build --target ${{ matrix.target }}

      - name: Upload bundled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.zip
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/latest*.json

  create-release:
    name: Create GitHub Release
    needs: [prepare-release, build-tauri]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes from CHANGELOG
        run: |
          VERSION="${{ needs.prepare-release.outputs.new_version }}"
          awk -v v="$VERSION" '
            BEGIN{in_section=0}
            $0 ~ "^## \\["v"\\]" {in_section=1}
            in_section && $0 ~ "^## \\[" && $0 !~ "^## \\["v"\\]" {exit}
            in_section {print}
          ' CHANGELOG.md > RELEASE_BODY.md

          if [ ! -s RELEASE_BODY.md ]; then
            echo "## [$VERSION]" > RELEASE_BODY.md
            echo >> RELEASE_BODY.md
            echo "See CHANGELOG.md for details." >> RELEASE_BODY.md
          fi

      - name: Collect release files
        id: files
        shell: bash
        run: |
          mapfile -t file_list < <(find artifacts -type f \( \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o \
            -name '*.app.zip' -o \
            -name '*.sig' -o \
            -name '*.msi' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name 'latest*.json' \
          \) | sort)

          if [ "${#file_list[@]}" -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi

          {
            echo 'files<<EOF'
            printf '%s\n' "${file_list[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-release.outputs.new_version }}
          name: v${{ needs.prepare-release.outputs.new_version }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          files: ${{ steps.files.outputs.files }}
