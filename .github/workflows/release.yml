name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - ".github/**"
      - "docs/superpowers/**"
      - "*.md"
      - "LICENSE"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "PRODUCTION.md"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force a patch version bump and full desktop release"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      old_version: ${{ steps.version.outputs.old_version }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Determine version bump
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
        run: node scripts/determine-version.js

      - name: Update version, README and CHANGELOG
        if: steps.version.outputs.should_release == 'true'
        run: node scripts/update-version.js ${{ steps.version.outputs.new_version }} ${{ steps.version.outputs.old_version }}

      - name: Commit, tag and push
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version file changes to commit"
          else
            git commit -m "chore(release): v${{ steps.version.outputs.new_version }} [skip ci]"
          fi
          git tag "v${{ steps.version.outputs.new_version }}" || true
          git push origin master
          git push origin "v${{ steps.version.outputs.new_version }}" || true

  build-tauri:
    name: Build ${{ matrix.label }}
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal DMG covers Intel and Apple Silicon. Two per-arch DMGs
          # would mean two trips through Apple's notary queue, which is the part
          # that takes hours — this halves the exposure and is why there is no
          # separate macos-x64 job.
          - label: macos-universal
            # Pin a stable Apple Silicon image. `macos-latest` changes over time
            # and can silently move the release to a new macOS/Xcode generation.
            os: macos-15
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            # Build ~40m + up to 5h waiting on Apple's notary queue.
            timeout: 360
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            timeout: 60
          - label: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            timeout: 60
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @npmax/types --filter @npmax/core --filter @npmax/api-client --filter @npmax/ui --filter @npmax/app-shell build

      - name: Build Tauri bundle
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        # Pass --target to the Tauri CLI (not after `--`, which would only go to cargo).
        # Otherwise the binary lands in target/<triple>/release/ while the bundler
        # looks in target/release/ and fails with ENOENT.
        #
        # macOS: APPLE_CERTIFICATE (+ password) are required for codesign.
        # APPLE_SIGNING_IDENTITY is optional — if missing/wrong we detect it from the .p12
        # (avoids "failed to resolve signing identity" from typos/quotes in the secret).
        run: |
          if [[ "${{ matrix.label }}" == macos-* ]]; then
            if [ -z "${APPLE_CERTIFICATE:-}" ]; then
              echo "APPLE_CERTIFICATE missing; building without codesigning (macOS)."
              unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            else
              # Strip accidental quotes/whitespace from identity secret
              if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
                APPLE_SIGNING_IDENTITY="$(printf '%s' "$APPLE_SIGNING_IDENTITY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
                export APPLE_SIGNING_IDENTITY
              fi

              CERT_FILE="$(mktemp /tmp/npmax-cert.XXXXXX.p12)"
              KEYCHAIN_PATH="$(mktemp /tmp/npmax-kc.XXXXXX.keychain-db)"
              rm -f "$KEYCHAIN_PATH"
              KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
              echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_FILE"
              security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
              security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
              security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
              # Password may be empty for some exports
              security import "$CERT_FILE" -k "$KEYCHAIN_PATH" -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/security || true
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true

              echo "=== Codesigning identities in certificate ==="
              security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

              DETECTED="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | grep -F 'Developer ID Application:' | head -1 | sed -n 's/.*"\(.*\)"/\1/p' || true)"
              WRONG_MAS="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | grep -F '3rd Party Mac Developer Application:' | head -1 | sed -n 's/.*"\(.*\)"/\1/p' || true)"

              rm -f "$CERT_FILE"
              security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

              if [ -n "$DETECTED" ]; then
                if [ -z "${APPLE_SIGNING_IDENTITY:-}" ] || [ "$APPLE_SIGNING_IDENTITY" != "$DETECTED" ]; then
                  echo "Using signing identity from .p12: $DETECTED"
                  if [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && [ "$APPLE_SIGNING_IDENTITY" != "$DETECTED" ]; then
                    echo "Note: APPLE_SIGNING_IDENTITY secret did not match .p12; overriding with Developer ID Application from .p12."
                  fi
                  export APPLE_SIGNING_IDENTITY="$DETECTED"
                else
                  echo "APPLE_SIGNING_IDENTITY matches .p12: $APPLE_SIGNING_IDENTITY"
                fi
              else
                echo "::error::APPLE_CERTIFICATE .p12 does not contain a Developer ID Application identity."
                if [ -n "$WRONG_MAS" ]; then
                  echo "::error::Found Mac App Store cert instead: $WRONG_MAS"
                  echo "Re-export from Keychain Access the certificate named exactly:"
                  echo "  Developer ID Application: …"
                  echo "Not: 3rd Party Mac Developer Application"
                else
                  echo "Export Developer ID Application (with private key) from Keychain → My Certificates → .p12"
                fi
                echo "Then: base64 -i YourNew.p12 | pbcopy  → update GitHub secret APPLE_CERTIFICATE"
                exit 1
              fi
            fi
          fi

          if [[ "${{ matrix.label }}" == macos-* ]] && [ -n "${APPLE_CERTIFICATE:-}" ]; then
            # Build signed but NOT notarized. Tauri's bundler notarizes inline as
            # soon as it sees APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID, using
            # `notarytool submit --wait` with no timeout — that call has hung for
            # hours here on submissions Apple had already accepted. Strip the three
            # so Tauri only codesigns, then notarize explicitly with a bounded poll.
            env -u APPLE_ID -u APPLE_PASSWORD -u APPLE_TEAM_ID \
              pnpm --filter @npmax/desktop exec tauri build --target ${{ matrix.target }}

            BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
            APP_PATH="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
            DMG_PATH="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            if [ -z "$APP_PATH" ] || [ -z "$DMG_PATH" ]; then
              echo "::error::Tauri did not create a macOS .app and .dmg under $BUNDLE_DIR."
              exit 1
            fi

            echo "=== Verifying Developer ID signature ==="
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            codesign --display --verbose=4 "$APP_PATH" 2>&1 | \
              grep -E '^(Identifier|TeamIdentifier|Authority|Runtime Version)=' || true
            echo "=== Architectures in the universal binary ==="
            lipo -archs "$APP_PATH/Contents/MacOS/npmax"

            if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
              echo "::error::APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are required to notarize."
              exit 1
            fi
            scripts/notarize-macos.sh "$DMG_PATH"
          else
            pnpm --filter @npmax/desktop exec tauri build --target ${{ matrix.target }}
          fi

      - name: Sign in to Azure
        if: matrix.label == 'windows-x64' && vars.AZURE_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows installers
        if: matrix.label == 'windows-x64' && vars.AZURE_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\apps\desktop\src-tauri\target\${{ matrix.target }}\release\bundle
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload bundled artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.zip
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/latest*.json
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/notarization-submission.txt
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/notarization-status.txt

  create-release:
    name: Create GitHub Release
    needs: [prepare-release, build-tauri]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate release notes from CHANGELOG
        run: |
          VERSION="${{ needs.prepare-release.outputs.new_version }}"
          awk -v v="$VERSION" '
            BEGIN{in_section=0}
            $0 ~ "^## \\["v"\\]" {in_section=1}
            in_section && $0 ~ "^## \\[" && $0 !~ "^## \\["v"\\]" {exit}
            in_section {print}
          ' CHANGELOG.md > RELEASE_BODY.md

          if [ ! -s RELEASE_BODY.md ]; then
            echo "## [$VERSION]" > RELEASE_BODY.md
            echo >> RELEASE_BODY.md
            echo "See CHANGELOG.md for details." >> RELEASE_BODY.md
          fi

      # The updater plugin points at releases/latest/download/latest.json, so the
      # manifest has to be published as a release asset or auto-update never works.
      - name: Generate updater manifest
        run: >
          node scripts/generate-latest-json.js
          "${{ needs.prepare-release.outputs.new_version }}" artifacts RELEASE_BODY.md

      - name: Collect release files
        id: files
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_KEY_ID: ${{ vars.LINUX_GPG_KEY_ID }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          mapfile -t file_list < <(find artifacts -type f \( \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o \
            -name '*.app.zip' -o \
            -name '*.sig' -o \
            -name '*.msi' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' \
          \) | sort)

          if [ "${#file_list[@]}" -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi
          file_list+=("latest.json")

          for file in "${file_list[@]}"; do
            printf '%s  %s\n' "$(sha256sum "$file" | awk '{print $1}')" "$(basename "$file")"
          done > SHA256SUMS.txt
          file_list+=("SHA256SUMS.txt")

          if [ -n "${LINUX_GPG_PRIVATE_KEY:-}" ]; then
            if [ -z "${LINUX_GPG_KEY_ID:-}" ] || [ -z "${LINUX_GPG_PASSPHRASE:-}" ]; then
              echo "::error::LINUX_GPG_KEY_ID and LINUX_GPG_PASSPHRASE are required with LINUX_GPG_PRIVATE_KEY."
              exit 1
            fi
            export GNUPGHOME="$RUNNER_TEMP/npmax-gpg"
            mkdir -m 700 "$GNUPGHOME"
            printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
            gpg --batch --yes --pinentry-mode loopback --passphrase "$LINUX_GPG_PASSPHRASE" \
              --armor --local-user "$LINUX_GPG_KEY_ID" --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
            gpg --batch --armor --export "$LINUX_GPG_KEY_ID" > npmax-release-key.asc
            file_list+=("SHA256SUMS.txt.asc" "npmax-release-key.asc")
          fi

          {
            echo 'files<<EOF'
            printf '%s\n' "${file_list[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare-release.outputs.new_version }}
          name: v${{ needs.prepare-release.outputs.new_version }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          files: ${{ steps.files.outputs.files }}
