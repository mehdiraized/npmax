[package]
name = "npmax"
version = "3.2.0"
description = "npMax desktop"
authors = ["mehdir"]
edition = "2021"

[lib]
name = "npmax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
tokio = { version = "1", features = ["time", "process", "io-util", "rt-multi-thread", "macros"] }
thiserror = "2"

# GHSA-wrw7-89jp-8q8g: Tauri 2 Linux stack is pinned to glib 0.18 via gtk3/webkit2gtk.
# Official advisory fix is 0.20.0 (unreachable). Local backport of VariantStrIter fix.
# Remove when glib 0.18.6 ships or Tauri migrates to GTK4.
[patch.crates-io]
glib = { path = "patches/glib" }
